apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "PolyNSI.fullname" . }}
  labels:
    {{- include "PolyNSI.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Chart.Name }}
  selector:
    matchLabels:
      {{- include "PolyNSI.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/tls: {{ include (print $.Template.BasePath "/tls-configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "PolyNSI.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "PolyNSI.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            {{- if .Values.image.command }}
            {{- toYaml .Values.image.command | nindent 12 }}
            {{- else }}
            - "java"
            {{- end }}
          args:
            {{- if .Values.image.args }}
            {{- toYaml .Values.image.args | nindent 12 }}
            {{- else }}
            - "-Dspring.config.location=/usr/local/etc/polynsi/application.properties"
            - "-Dspring.config.additional-location=/usr/local/etc/polynsi/tls-config/tls.properties"
            - "-jar"
            - "polynsi.jar"
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-alt
              containerPort: {{ if .Values.config.tls.server.enabled }}{{ .Values.config.tls.server.port }}{{ else }}8080{{ end }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ if .Values.config.tls.server.enabled }}{{ .Values.config.tls.server.port }}{{ else }}{{ .Values.livenessProbe.port }}{{ end }}
              scheme: {{ if .Values.config.tls.server.enabled }}HTTPS{{ else }}HTTP{{ end }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ if .Values.config.tls.server.enabled }}{{ .Values.config.tls.server.port }}{{ else }}{{ .Values.readinessProbe.port }}{{ end }}
              scheme: {{ if .Values.config.tls.server.enabled }}HTTPS{{ else }}HTTP{{ end }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              subPath: {{ .Values.persistence.subPath }}
          {{- end }}
            - name: config
              mountPath: "/usr/local/etc/polynsi"
              readOnly: true
            - name: tls-config
              mountPath: "/usr/local/etc/polynsi/tls-config"
              readOnly: true
          {{- if .Values.config.tls.server.enabled }}
            - name: server-identity
              mountPath: "/usr/local/etc/polynsi/tls/server"
              readOnly: true
            - name: server-ca
              mountPath: "/usr/local/etc/polynsi/tls/server-ca"
              readOnly: true
          {{- end }}
          {{- if .Values.config.tls.client.enabled }}
            - name: client-identity
              mountPath: "/usr/local/etc/polynsi/tls/client"
              readOnly: true
            - name: client-ca
              mountPath: "/usr/local/etc/polynsi/tls/client-ca"
              readOnly: true
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            {{- if .Values.config.configMapName }}
            name: {{ .Values.config.configMapName }}
            {{- else }}
            name: {{ printf "%s-config" (include "PolyNSI.fullname" .) }}
            {{- end }}
            items:
            - key: "application.properties"
              path: "application.properties"
            - key: "logback-spring.xml"
              path: "logback-spring.xml"
        - name: tls-config
          configMap:
            name: {{ printf "%s-tls" (include "PolyNSI.fullname" .) }}
        {{- if .Values.config.tls.server.enabled }}
        {{- $serverIdentitySecret := include "PolyNSI.serverIdentitySecretName" . }}
        - name: server-identity
          secret:
            secretName: {{ $serverIdentitySecret }}
            defaultMode: 0440
            items:
            - key: {{ .Values.config.tls.server.certKey }}
              path: tls.crt
            - key: {{ .Values.config.tls.server.keyKey }}
              path: tls.key
        - name: server-ca
          secret:
            secretName: {{ .Values.config.tls.server.caSecretName }}
            defaultMode: 0440
            items:
            - key: {{ .Values.config.tls.server.caKey }}
              path: ca.crt
        {{- end }}
        {{- if .Values.config.tls.client.enabled }}
        {{- $clientIdentitySecret := include "PolyNSI.clientIdentitySecretName" . }}
        - name: client-identity
          secret:
            secretName: {{ $clientIdentitySecret }}
            defaultMode: 0440
            items:
            - key: {{ .Values.config.tls.client.certKey }}
              path: tls.crt
            - key: {{ .Values.config.tls.client.keyKey }}
              path: tls.key
        - name: client-ca
          secret:
            secretName: {{ .Values.config.tls.client.caSecretName }}
            defaultMode: 0440
            items:
            - key: {{ .Values.config.tls.client.caKey }}
              path: ca.crt
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      {{- with .Values.persistence.annotations }}
        annotations:
        {{- range $key, $value := . }}
          {{ $key }}: {{ $value }}
        {{- end }}
      {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
