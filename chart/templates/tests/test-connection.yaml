apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "PolyNSI.fullname" . }}-test-connection"
  labels:
    {{- include "PolyNSI.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - "-O"
        - "-"
        {{- if .Values.config.tls.server.enabled }}
        - "--no-check-certificate"
        {{- end }}
        - "{{ if .Values.config.tls.server.enabled }}https{{ else }}http{{ end }}://{{ include "PolyNSI.fullname" . }}:{{ .Values.service.port }}"
  restartPolicy: Never
