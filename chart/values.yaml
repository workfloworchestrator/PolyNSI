# Default values for PolyNSI.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/workfloworchestrator/polynsi
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "@sha256:69327c8ad4fd2eec192efd7a2e84cebe41d20cdc6e43537f367dd1ce02ac503e"
  command:
    - "java"
  args:
    - "-Dspring.config.location=/usr/local/etc/polynsi/application.properties"
    - "-Dspring.config.additional-location=/usr/local/etc/polynsi/tls-config/tls.properties"
    - "-jar"
    - "polynsi.jar"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# The distroless image runs as nobody (65532). Keep Secret-mounted PEM files readable by that UID's
# group while retaining read-only 0440 mounts.
podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80  # polynsi:80 mapped to document_server_port (default 8080)
  grpc: 80  # polynsi-grpc:80 mapped to grpc_server_insecure_port (default 50051)

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /soap
          pathType: ImplementationSpecific
          serviceName: polynsi
          servicePort: 80
        - path: /discovery
          pathType: ImplementationSpecific
          serviceName: supa
          servicePort: 80
        - path: /topology
          pathType: ImplementationSpecific
          serviceName: supa
          servicePort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Expose the service via gateway-api HTTPRoute instead of an Ingress.
# Requires Gateway API CRDs and a suitable controller (e.g. Envoy Gateway).
# Each rule may define its own backendRefs; when omitted the rule falls back
# to this chart's own service on service.port.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /soap
      backendRefs:
        - name: polynsi
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /discovery
        - path:
            type: PathPrefix
            value: /topology
      backendRefs:
        - name: supa
          port: 80
          weight: 1

# if you do not want to use ingress annotations to generate the Certificate manifest
certificate:
  enabled: false
  name: chart-example-tls
  dnsName: example.domain.toplevel
  issuerRef:
    name: letsencrypt
    kind: Issuer
  secretName: chart-example-tls
  privateKey:
    rotationPolicy: Always
    encoding: PKCS8

resources:
   limits:
     cpu: 1000m
     memory: 512Mi
   requests:
     cpu: 10m
     memory: 320Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  mountPath: /usr/local/var/db
  subPath:
  annotations: {}
  accessModes:
    - ReadWriteOnce
  size: 1Gi

readinessProbe:
  enabled: true
  path: /soap
  port: 8080
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

livenessProbe:
  enabled: true
  path: /soap
  port: 8080
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

config:
  #
  # PolyNSI needs the following two configuration files:
  # - application.properties
  # - logback-spring.xml
  #
  # When config.configMapName is defined it must point to an existing configmap, managed outside of Helm,
  # that contains all necessary configuration files. Otherwise, Helm will create a configmap with files from
  # a folder pointed to by config.filesGlob, or config.inlineData is used. Note that filesGlob takes precedence
  # over inline data.
  #
  # TLS (see config.tls below) is independent of the above: the chart always generates a small
  # (mounted at /usr/local/etc/polynsi/tls-config/tls.properties), so it applies regardless of
  # whether application.properties itself comes from inlineData, filesGlob, or an external configMapName.
  #
  #configMapName: my-configmap-with-config
  #filesGlob: "config/*"
  inlineData: |-
    application.properties: |-
      debug=false
      logging.config=file:/usr/local/etc/polynsi/logback-spring.xml
      cxf.path=/soap
      soap.server.connection_provider.path=/connection/provider
      soap.server.connection_requester.path=/connection/requester
      nl.surf.polynsi.client.certificate.authorize-dn-type=no
      nl.surf.polynsi.client.certificate.tls-client-auth-n-header=ssl-client-subject-dn
      nl.surf.polynsi.client.certificate.distinguished-names[0]=CN=CertA,OU=Dept X,O=Company 1,C=NL
      nl.surf.polynsi.client.certificate.distinguished-names[1]=CN=CertB,OU=Dept Y,O=Company 2,C=NL
      nl.surf.polynsi.client.certificate.distinguished-names[2]=CN=CertC,OU=Dept Z,O=Company 3,C=NL
      server.port=8080
      spring.grpc.server.port=9090
      spring.grpc.client.channel.connection-provider.target=static://localhost:50051
      spring.grpc.client.channel.connection-provider.ssl.enabled=false
    logback-spring.xml: |-
      <configuration>
          <include resource="org/springframework/boot/logging/logback/defaults.xml"/>
          <include resource="org/springframework/boot/logging/logback/console-appender.xml" />
          <root level="INFO">
              <appender-ref ref="CONSOLE" />
          </root>
          <logger name="org.springframework.web" level="INFO"/>
          <!-- set to WARN to prevent ReflectionServiceFactoryBean create message -->
          <logger name="org.apache.cxf.wsdl.service.factory.ReflectionServiceFactoryBean" level="WARN"/>
          <!-- set to WARN to suppress logging of in and out SOAP message -->
          <logger name="org.apache.cxf.services" level="WARN"/>
          <!-- set to TRACE for detailed connection provider logging including protobuf message -->
          <logger name="nl.surf.polynsi.soap.connection.provider.ConnectionServiceProviderPortImpl" level="INFO"/>
          <!-- set to TRACE for detailed connection requester logging including protobuf message -->
          <logger name="nl.surf.polynsi.grpc.connection.requester.ConnectionRequesterService" level="INFO"/>
      </configuration>

  # TLS is configured directly from PEM material (Spring Boot's spring.ssl.bundle.pem.*) — no JKS/
  # PKCS12 conversion. The inbound SOAP server and outbound SOAP client are switched on independently;
  # enabling either requires its own identity (certificate+key) Secret *and* CA (trust anchor) Secret.
  # Nothing is inferred or shared implicitly: a missing identity or CA on an enabled mode fails the
  # `helm template`/`helm install` render rather than silently falling back to JVM-default trust.
  tls:
    # Inbound SOAP server TLS (server.ssl.bundle=nsi-soap-server, server.ssl.client-auth=need).
    # Disabled by default — the chart ships plaintext HTTP on port 8080, matching the default
    # readinessProbe/livenessProbe/Service. Enabling it switches the container port and both probes
    # to config.tls.server.port over HTTPS.
    server:
      enabled: false
      port: 8443
      # Secret containing the server's certificate+key. Left empty by default; set explicitly, or opt
      # into reusing the certificate.secretName Secret via identity.useCertificateSecret below (only
      # takes effect when certificate.enabled is also true — the placeholder default name is never
      # used implicitly).
      identitySecretName: ""
      identity:
        useCertificateSecret: false
      certKey: tls.crt
      keyKey: tls.key
      # CA bundle Secret used to verify inbound client certificates. Required whenever server.enabled
      # is true — kept independent of the identity Secret because ACME-issued Secrets have no ca.crt.
      caSecretName: ""
      caKey: ca.crt
    # Outbound SOAP client (mutual) TLS used by ConnectionRequesterService for gRPC->SOAP callbacks
    # to peer NSAs. Disabled by default, matching the previous chart (the bundle was never configured
    # at all, so outbound calls silently used no client certificate).
    client:
      enabled: false
      identitySecretName: ""
      identity:
        useCertificateSecret: false
      certKey: tls.crt
      keyKey: tls.key
      # CA bundle Secret used to verify the peer NSA's server certificate. Required whenever
      # client.enabled is true.
      caSecretName: ""
      caKey: ca.crt
